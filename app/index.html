<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>DulliSmartTV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
    <div id="bg"></div>
    <div id="shade"></div>

    <div id="home" class="screen">
        <div id="clock">
            <div id="time">--:--</div>
            <div id="date"></div>
        </div>
        <div id="tiles" class="dock"><div id="tiles-inner"></div></div>
    </div>

    <div id="panel" class="hidden">
        <h1 id="panel-title">Einstellungen</h1>
        <div id="panel-list"></div>
        <div id="panel-hint"></div>
    </div>

    <div id="toast" class="hidden"></div>
</div>
<script src="js/data.js"></script>
<script src="js/platform.js"></script>
<script src="js/main.js"></script>
</body>
</html>
